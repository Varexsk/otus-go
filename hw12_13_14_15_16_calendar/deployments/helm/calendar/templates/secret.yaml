apiVersion: v1
kind: Secret
metadata:
  name: {{ include "calendar.secretName" . }}
type: Opaque
stringData:
  DATABASE_DSN: {{ include "calendar.dsn" . | quote }}
  RABBIT_URL: {{ include "calendar.rabbitURL" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  RABBITMQ_PASSWORD: {{ .Values.rabbitmq.password | quote }}
